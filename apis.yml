name: Zum
description: 'Zum is a student transportation technology company that runs school
  bus operations for K-12 school districts through its Connected Mobility Experience
  (CMX) platform. Founded by Ritu Narayan and headquartered in Redwood City, California,
  Zum unifies parents, students, drivers, and district administrators with real-time
  ride tracking, route optimization, parent notification apps, driver tooling, fleet
  management dashboards, and an electrified bus program. The company serves roughly
  6,500 schools and districts, has completed more than 159 million rides, and is backed
  by SoftBank Vision Fund. Zum operates consumer-facing parent and driver mobile apps
  and district dashboards, but publishes no public developer portal, API documentation,
  or API surface at this time.'
